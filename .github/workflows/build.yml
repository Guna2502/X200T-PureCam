name: Build X200T PureCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate X200T PureCam Android Project
        run: |
          mkdir -p app/src/main/java/com/ss/android/ugc/aweme
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "X200TPureCam"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ss.android.ugc.aweme'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ss.android.ugc.aweme"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-X200T-Pure"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              def camerax_version = "1.3.4"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"

              implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta5'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="X200T PureCam"
                  android:supportsRtl="true"
                  android:largeHeap="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ss/android/ugc/aweme/MainActivity.kt
          @file:OptIn(ExperimentalCamera2Interop::class)

          package com.ss.android.ugc.aweme

          import android.Manifest
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraMetadata
          import android.hardware.camera2.CaptureRequest
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.*
          import androidx.annotation.OptIn
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.camera2.interop.Camera2CameraControl
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.camera2.interop.Camera2Interop
          import androidx.camera.camera2.interop.ExperimentalCamera2Interop
          import androidx.camera.core.*
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.segmentation.Segmentation
          import com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.max
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var statusText: TextView
              private lateinit var modeBtn: Button
              private lateinit var shutterBtn: Button
              private lateinit var cameraExecutor: ExecutorService

              private var imageCapture: ImageCapture? = null
              private var camera: Camera? = null
              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private var currentZoom = 1.0f

              private var captureMode = 1
              private var lastSavedUri: Uri? = null

              private val segmenter by lazy {
                  val options = SelfieSegmenterOptions.Builder()
                      .setDetectorMode(SelfieSegmenterOptions.SINGLE_IMAGE_MODE)
                      .build()
                  Segmentation.getClient(options)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  cameraExecutor = Executors.newSingleThreadExecutor()
                  setupUI()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCamera()
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                  }
              }

              private fun setupUI() {
                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }

                  previewView = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.PERFORMANCE
                      scaleType = PreviewView.ScaleType.FIT_CENTER
                  }
                  root.addView(previewView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  statusText = TextView(this).apply {
                      text = "X200T PureCam | ISP Beauty: OFF | 100% Detail"
                      setTextColor(Color.parseColor("#00E676"))
                      textSize = 13f
                      setPadding(32, 48, 32, 24)
                      setBackgroundColor(Color.parseColor("#88000000"))
                      gravity = Gravity.CENTER
                  }
                  root.addView(statusText, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP
                  ))

                  val bottomLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#AA000000"))
                      setPadding(24, 24, 24, 48)
                  }

                  val zoomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  val zooms = listOf(0.6f to "0.6x UW", 1.0f to "1x Main", 2.0f to "2x Crop", 3.0f to "3x Tele")
                  zooms.forEach { (z, label) ->
                      val zBtn = Button(this).apply {
                          text = label
                          textSize = 11f
                          setOnClickListener { setZoom(z) }
                      }
                      zoomRow.addView(zBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  bottomLayout.addView(zoomRow)

                  val evSeek = SeekBar(this).apply {
                      max = 20
                      progress = 10
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) {
                              val ev = p - 10
                              camera?.cameraControl?.setExposureCompensationIndex(ev)
                              statusText.text = "EV: $ev | ISP Beauty: OFF | Mode: ${getModeName()}"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  bottomLayout.addView(evSeek)

                  val actionRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 16, 0, 0)
                  }

                  modeBtn = Button(this).apply {
                      text = "MODE:\nDETAIL+"
                      textSize = 12f
                      setOnClickListener {
                          captureMode = (captureMode + 1) % 3
                          text = "MODE:\n${getModeName()}"
                          statusText.text = "X200T PureCam | Mode: ${getModeName()} (0% Beauty)"
                      }
                  }

                  shutterBtn = Button(this).apply {
                      text = "SNAP 100%"
                      textSize = 16f
                      setBackgroundColor(Color.parseColor("#FF5252"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { takePurePhoto() }
                  }

                  val flipBtn = Button(this).apply {
                      text = "FLIP /\nGALLERY"
                      textSize = 12f
                      setOnClickListener {
                          lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                              CameraSelector.LENS_FACING_FRONT
                          } else {
                              CameraSelector.LENS_FACING_BACK
                          }
                          startCamera()
                      }
                      setOnLongClickListener {
                          lastSavedUri?.let { uri ->
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                          }
                          true
                      }
                  }

                  actionRow.addView(modeBtn, LinearLayout.LayoutParams(0, 160, 1f))
                  actionRow.addView(shutterBtn, LinearLayout.LayoutParams(0, 180, 1.3f).apply {
                      setMargins(20, 0, 20, 0)
                  })
                  actionRow.addView(flipBtn, LinearLayout.LayoutParams(0, 160, 1f))

                  bottomLayout.addView(actionRow)

                  root.addView(bottomLayout, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM
                  ))

                  previewView.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_UP) {
                          val factory = previewView.meteringPointFactory
                          val point = factory.createPoint(event.x, event.y)
                          val action = FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE)
                              .setAutoCancelDuration(4, TimeUnit.SECONDS)
                              .build()
                          camera?.cameraControl?.startFocusAndMetering(action)
                          statusText.text = "Focus Locked | Zero Skin Smoothing Active"
                      }
                      true
                  }

                  setContentView(root)
              }

              private fun getModeName(): String {
                  return when (captureMode) {
                      0 -> "RAW-JPEG"
                      1 -> "DETAIL+"
                      else -> "PORTRAIT"
                  }
              }

              private fun setZoom(ratio: Float) {
                  currentZoom = ratio
                  camera?.cameraControl?.setZoomRatio(ratio)
                  statusText.text = "Zoom: ${ratio}x | ISP Beauty: OFF | ${getModeName()}"
              }

              private fun startCamera() {
                  val providerFuture = ProcessCameraProvider.getInstance(this)
                  providerFuture.addListener({
                      val provider = providerFuture.get()

                      val resSelector = ResolutionSelector.Builder()
                          .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                          .setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY)
                          .build()

                      val previewBuilder = Preview.Builder().setResolutionSelector(resSelector)
                      val captureBuilder = ImageCapture.Builder()
                          .setResolutionSelector(resSelector)
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                          .setJpegQuality(100)

                      val previewExt = Camera2Interop.Extender(previewBuilder)
                      val captureExt = Camera2Interop.Extender(captureBuilder)

                      listOf(previewExt, captureExt).forEach { ext ->
                          ext.setCaptureRequestOption(CaptureRequest.CONTROL_EFFECT_MODE, CameraMetadata.CONTROL_EFFECT_MODE_OFF)
                          ext.setCaptureRequestOption(CaptureRequest.CONTROL_SCENE_MODE, CameraMetadata.CONTROL_SCENE_MODE_DISABLED)
                          ext.setCaptureRequestOption(CaptureRequest.STATISTICS_FACE_DETECT_MODE, CameraMetadata.STATISTICS_FACE_DETECT_MODE_OFF)
                          ext.setCaptureRequestOption(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_HIGH_QUALITY)
                          ext.setCaptureRequestOption(CaptureRequest.COLOR_CORRECTION_ABERRATION_MODE, CameraMetadata.COLOR_CORRECTION_ABERRATION_MODE_HIGH_QUALITY)
                          ext.setCaptureRequestOption(CaptureRequest.JPEG_QUALITY, 100.toByte())
                      }

                      val preview = previewBuilder.build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }
                      imageCapture = captureBuilder.build()

                      val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()

                      try {
                          provider.unbindAll()
                          camera = provider.bindToLifecycle(this, selector, preview, imageCapture)
                          applyMinimalNoiseReduction(camera!!)
                          camera?.cameraControl?.setZoomRatio(currentZoom)
                      } catch (e: Exception) {
                          statusText.text = "Camera Error: ${e.message}"
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun applyMinimalNoiseReduction(cam: Camera) {
                  val chars = Camera2CameraInfo.from(cam.cameraInfo)
                  val nrModes = chars.getCameraCharacteristic(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES) ?: intArrayOf()

                  val bestNrMode = when {
                      nrModes.contains(CameraMetadata.NOISE_REDUCTION_MODE_MINIMAL) -> CameraMetadata.NOISE_REDUCTION_MODE_MINIMAL
                      nrModes.contains(CameraMetadata.NOISE_REDUCTION_MODE_ZERO_SHUTTER_LAG) -> CameraMetadata.NOISE_REDUCTION_MODE_ZERO_SHUTTER_LAG
                      nrModes.contains(CameraMetadata.NOISE_REDUCTION_MODE_FAST) -> CameraMetadata.NOISE_REDUCTION_MODE_FAST
                      else -> CameraMetadata.NOISE_REDUCTION_MODE_HIGH_QUALITY
                  }

                  val c2Control = Camera2CameraControl.from(cam.cameraControl)
                  val bundle = androidx.camera.camera2.interop.CaptureRequestOptions.Builder()
                      .setCaptureRequestOption(CaptureRequest.NOISE_REDUCTION_MODE, bestNrMode)
                      .setCaptureRequestOption(CaptureRequest.STATISTICS_FACE_DETECT_MODE, CameraMetadata.STATISTICS_FACE_DETECT_MODE_OFF)
                      .build()
                  c2Control.addCaptureRequestOptions(bundle)
              }

              private fun takePurePhoto() {
                  val capture = imageCapture ?: return
                  shutterBtn.isEnabled = false
                  statusText.text = "Capturing 100% Uncompressed Sensor Data..."

                  capture.takePicture(cameraExecutor, object : ImageCapture.OnImageCapturedCallback() {
                      override fun onCaptureSuccess(image: ImageProxy) {
                          try {
                              val buffer = image.planes[0].buffer
                              val bytes = ByteArray(buffer.remaining())
                              buffer.get(bytes)
                              val rot = image.imageInfo.rotationDegrees
                              image.close()

                              var bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                
